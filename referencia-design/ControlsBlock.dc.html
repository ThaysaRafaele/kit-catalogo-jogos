<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Bloco de controles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;family=Pixelify+Sans:wght@400;600;700&amp;family=Press+Start+2P&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<ul style="margin: 0; padding: 16px; list-style: none; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; background: #fffdf6; border: 4px solid #2b1406; border-radius: 12px; font-family: 'Nunito', sans-serif; color: #2b1a10">
<sc-for list="{{controles}}" as="c" hint-placeholder-count="3">
<li style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<span style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{c.teclas}}" as="k" hint-placeholder-count="1">
<kbd style="min-width: 44px; height: 44px; box-sizing: border-box; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; background: #ffffff; border: 3px solid #2b1406; border-radius: 8px; box-shadow: 0 4px 0 #2b1406, inset 0 -3px 0 #e0d2b4; font-family: 'Pixelify Sans', sans-serif; font-size: 18px; font-weight: 700; color: #2b1406">{{k.t}}</kbd>
</sc-for>
</span>
<span aria-hidden="true" style="font-family: 'Press Start 2P', monospace; font-size: 12px; color: #6b1d12">▶</span>
<span style="font-size: 17px; font-weight: 700">{{c.acao}}</span>
</li>
</sc-for>
</ul>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"controles":{"editor":null},"$preview":{"width":440,"height":320}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      controles: this.props.controles ?? [
        { acao: 'Mover', teclas: [ { t: 'W' }, { t: 'A' }, { t: 'S' }, { t: 'D' } ] },
        { acao: 'Mover (alternativo)', teclas: [ { t: '←' }, { t: '↑' }, { t: '→' }, { t: '↓' } ] },
        { acao: 'Pular', teclas: [ { t: 'Espaço' } ] },
        { acao: 'Atacar', teclas: [ { t: 'Clique' } ] }
      ]
    };
  }
}
</script>
</body>
</html>
