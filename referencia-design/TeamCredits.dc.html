<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Créditos da equipe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;family=Pixelify+Sans:wght@400;600;700&amp;family=Press+Start+2P&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<section style="width: 100%; box-sizing: border-box; background: #20123a; border: 4px solid #2b1406; border-radius: 12px; padding: 18px 20px; box-shadow: 0 6px 0 #2b1406; font-family: 'Nunito', sans-serif; color: #fff6e0; text-align: center">
<h3 style="margin: 0; font-family: 'Press Start 2P', monospace; font-size: 15px; line-height: 1.5; color: #ffcf5a">{{titulo}}</h3>
<p style="margin: 6px 0 14px; font-family: 'Pixelify Sans', sans-serif; font-size: 17px; font-weight: 600; color: #9ee8ff">{{subtitulo}}</p>
<dl style="margin: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{equipe}}" as="e" hint-placeholder-count="4">
<div style="display: flex; align-items: baseline; gap: 8px">
<dt style="flex: none; font-family: 'Pixelify Sans', sans-serif; font-size: 16px; font-weight: 700; color: #ffcf5a; text-transform: uppercase">{{e.funcao}}</dt>
<span aria-hidden="true" style="flex: 1; border-bottom: 3px dotted #7d6aa8; transform: translateY(-4px)"></span>
<dd style="margin: 0; flex: none; font-size: 17px; font-weight: 700; color: #ffffff">{{e.nome}}</dd>
</div>
</sc-for>
</dl>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"titulo":{"editor":"text","default":"EQUIPE"},"subtitulo":{"editor":"text","default":"[Nome do estúdio]"},"equipe":{"editor":null},"$preview":{"width":440,"height":440}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    return {
      titulo: p.titulo ?? 'EQUIPE',
      subtitulo: p.subtitulo ?? '[Nome do estúdio]',
      equipe: p.equipe ?? [
        { funcao: 'Roteiro', nome: '[Primeiro nome]' },
        { funcao: 'Arte', nome: '[Primeiro nome]' },
        { funcao: 'Programação', nome: '[Primeiro nome]' },
        { funcao: 'Som', nome: '[Primeiro nome]' },
        { funcao: 'Testes', nome: '[Primeiro nome]' }
      ]
    };
  }
}
</script>
</body>
</html>
