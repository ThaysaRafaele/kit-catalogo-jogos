<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ficha de personagem</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;family=Pixelify+Sans:wght@400;600;700&amp;family=Press+Start+2P&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<article style="width: 100%; box-sizing: border-box; background: #fffaf0; border: 4px solid #2b1406; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 0 #2b1406; font-family: 'Nunito', sans-serif; color: #2b1a10">
<p style="margin: 0; background: {{cor}}; color: #ffffff; padding: 10px 14px; font-family: 'Pixelify Sans', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 1px; display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="font-family: 'Press Start 2P', monospace; font-size: 12px; background: #ffffff; color: {{cor}}; border-radius: 4px; padding: 4px 6px">{{tag}}</span>{{papel}}</p>
<div style="padding: 14px; display: flex; flex-direction: column; gap: 12px">
<dc-import name="DrawingFrame" variant="carta" src="{{foto}}" alt="Desenho de {{nome}}" legenda="" altura="{{220}}" accent="{{cor}}" hint-size="100%,260px"></dc-import>
<h4 style="margin: 0; font-family: 'Pixelify Sans', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.2; color: #2b1406">{{nome}}</h4>
<dl style="margin: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{campos}}" as="c" hint-placeholder-count="2">
<div style="border-top: 3px dotted #b89a6a; padding-top: 8px">
<dt style="font-family: 'Pixelify Sans', sans-serif; font-size: 15px; font-weight: 700; color: #6b1d12; text-transform: uppercase">{{c.rotulo}}</dt>
<dd style="margin: 4px 0 0; font-size: 16px; line-height: 1.55">{{c.texto}}</dd>
</div>
</sc-for>
</dl>
</div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tipo":{"editor":"enum","options":["protagonista","antagonista"],"default":"protagonista"},"nome":{"editor":"text","default":"[Nome do personagem]"},"foto":{"editor":"text","default":""},"campos":{"editor":null},"$preview":{"width":440,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var ant = p.tipo === 'antagonista';
    return {
      cor: ant ? '#7a1424' : '#2f6b2a',
      tag: ant ? 'BOSS' : 'P1',
      papel: ant ? 'ANTAGONISTA' : 'PROTAGONISTA',
      nome: p.nome ?? '[Nome do personagem]',
      foto: p.foto || '',
      campos: p.campos ?? (ant
        ? [ { rotulo: 'Motivação', texto: '[Por que age assim]' }, { rotulo: 'Relação com o protagonista', texto: '[Rival, parente, antigo aliado...]' } ]
        : [ { rotulo: 'Quem é?', texto: '[Quem é, de onde vem e o que quer]' }, { rotulo: 'Habilidade especial', texto: '[O poder ou talento que usa no jogo]' } ])
    };
  }
}
</script>
</body>
</html>
