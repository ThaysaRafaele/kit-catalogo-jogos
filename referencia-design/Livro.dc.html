<style>
body{margin:0;background:#9ad8ff}
a{color:#6b1d12}a:hover{color:#3b0d06}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:4px solid #0b2d8f;outline-offset:3px}
.spread{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.vs-grid{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:820px){.spread{grid-template-columns:minmax(0,1fr)}.page{padding:28px 20px 64px !important;min-height:0 !important}}
@media (max-width:560px){.vs-grid{grid-template-columns:minmax(0,1fr)}.duo{grid-template-columns:minmax(0,1fr)}}
.blink{animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.reading .blink{animation:none}
.corner{opacity:.85;transition:opacity .2s}
.corner:hover{opacity:1}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
</style>

    sp.push({ kind: 'end', label: 'Créditos finais' });
    return sp.map(function (s, idx) { return Object.assign(s, { idx: idx }); });
  }
  renderVals() {
    var st = this.state;
    var self = this;
    var sp = this.build();
    var n = sp.length;
    this._n = n;
    var total = n * 2;
    var p = Math.min(st.p, total - 1);
    var k = Math.floor(p / 2);
    var at = function (q) { return { s: sp[Math.floor(q / 2)], side: q % 2 ? 'R' : 'L' }; };
    var a = st.anim;
    var L = '10px', HALF = 'calc(50% - 10px)', FULL = 'calc(100% - 20px)';
    var stL = at(2 * k), stR = at(2 * k + 1), stOne = at(p);
    var front = at(p), back = null, sh = null, cA = null, cB = null;
    if (a) {
      if (!st.narrow) {
        var kf = Math.floor(a.from / 2), kt = Math.floor(a.to / 2);
        if (a.dir === 'next') {
          stL = at(2 * kf); stR = at(2 * kt + 1); front = at(2 * kf + 1); back = at(2 * kt);
          sh = { left: '50%', width: HALF, origin: 'left center', start: 0, end: -180, shadeF: grad('to right'), shadeB: grad('to left') };
          cA = { left: '50%', width: HALF, bg: grad('to right') }; cB = { left: L, width: HALF, bg: grad('to left') };
        } else {
          stL = at(2 * kt); stR = at(2 * kf + 1); front = at(2 * kf); back = at(2 * kt + 1);
          sh = { left: L, width: HALF, origin: 'right center', start: 0, end: 180, shadeF: grad('to left'), shadeB: grad('to right') };
          cA = { left: L, width: HALF, bg: grad('to left') }; cB = { left: '50%', width: HALF, bg: grad('to right') };
        }
      } else {
        if (a.dir === 'next') {
          stOne = at(a.to); front = at(a.from);
          sh = { left: L, width: FULL, origin: 'left center', start: 0, end: -180, shadeF: grad('to right'), shadeB: grad('to left') };
        } else {
          stOne = at(a.from); front = at(a.to);
          sh = { left: L, width: FULL, origin: 'left center', start: -180, end: 0, shadeF: grad('to right'), shadeB: grad('to left') };
        }
        cA = { left: L, width: FULL, bg: grad('to right') };
      }
    }
    this._sh = sh;
    var animating = !!a;
    var atStart = st.narrow ? p === 0 : k === 0;
    var atEnd = st.narrow ? p === total - 1 : k === n - 1;
    var filled = Math.max(1, Math.round((k + 1) / n * 5));
    var hearts = [0, 1, 2, 3, 4].map(function (i) { return { cheio: i < filled, vazio: i >= filled }; });
    var turmaOpts = ['Todas'].concat(TURMAS.map(function (t) { return t.id; })).map(function (v) {
      return { label: v, on: st.fTurma === v, pick: function () { self.setState({ fTurma: v }); } };
    });
    var temaOpts = [ { v: 'Todos', l: 'Todos' }, { v: 'folclore', l: 'Folclore' }, { v: 'scifi', l: 'Ficção' } ].map(function (o) {
      return { label: o.l, on: st.fTema === o.v, pick: function () { self.setState({ fTema: o.v }); } };
    });
    var toc = GAMES.filter(function (g) {
      return (st.fTurma === 'Todas' || g.turma === st.fTurma) && (st.fTema === 'Todos' || g.tema === st.fTema);
    }).map(function (g) { return { fase: g.fase, nome: g.nome, turma: g.turma, temaNome: g.temaNome, idx: g.idxA, go: self.linkGo(g.idxA) }; });
    var ctx = {
      logoEscola: LOGO_ESCOLA,
      logoCurso: this.props.logoCurso || '/_blob/c2961d77c59a2d971afd06d60f05d0f3',
      saves: [
        { slot: '01', ano: '2026', titulo: 'Mostra Cultural • LEVEL UP 2026', info: GAMES.length + ' jogos • ' + TURMAS.length + ' turmas', ativo: true, vazio: false, go: function () { self.flipTo(4); } },
        { slot: '02', ano: '2027', titulo: 'Slot vazio', info: 'Nova aventura em breve', ativo: false, vazio: true },
        { slot: '03', ano: '2028', titulo: 'Slot vazio', info: 'Nova aventura em breve', ativo: false, vazio: true }
      ],
      turmaOpts: turmaOpts, temaOpts: temaOpts, toc: toc, tocVazio: toc.length === 0,
      tocCount: toc.length === 1 ? '1 fase encontrada' : toc.length + ' fases encontradas',
      lider: MENTORS[0], profs: MENTORS.slice(1),
      creditosMostra: [
        { funcao: 'Coordenação', nome: '[Nome]' },
        { funcao: 'Professores', nome: '[Nomes]' },
        { funcao: 'Turmas', nome: TURMAS.map(function (t) { return t.id; }).join(' • ') },
        { funcao: 'Escola', nome: 'CEEP Hércules Maymone' },
        { funcao: 'Cidade', nome: 'Campo Grande, MS' }
      ],
      goSave: function () { self.flipTo(2); },
      goIntro: function () { self.flipTo(4); },
      goToc: function () { self.goTocFn(); },
      goStart: function () { if (self.state.reading) { try { window.scrollTo(0, 0); } catch (e) {} } else self.flipTo(0); }
    };
    this.goTocFn = function () {
      if (self.state.reading) { try { var el = document.getElementById('s-3'); if (el) el.scrollIntoView(); } catch (e) {} }
      else self.flipTo(6);
    };
    var label = sp[k].label;
    var liveMsg = st.reading ? 'Modo leitura ativado: todas as páginas em sequência.'
      : (st.narrow ? 'Página ' + (p + 1) + ' de ' + total + ': ' + label : 'Páginas ' + (2 * k + 1) + ' e ' + (2 * k + 2) + ' de ' + total + ': ' + label);
    return {
      appCls: st.reading ? 'reading' : 'book',
      bookMode: !st.reading, reading: st.reading,
      wide: !st.narrow, narrow: st.narrow,
      spreads: sp, ctx: ctx,
      stL: stL, stR: stR, stOne: stOne, front: front, back: back || { s: sp[0], side: 'L' },
      backPage: !!back, backBlank: !back,
      animOn: animating && !!sh, sh: sh || { left: L, width: HALF, origin: 'left center', start: 0, shadeF: 'none', shadeB: 'none' },
      cA: cA || { left: L, width: HALF, bg: 'none' }, cB: cB || { left: L, width: HALF, bg: 'none' }, hasCastB: !!cB,
      animating: animating, busyStr: animating ? 'true' : 'false',
      contentPE: animating ? 'none' : 'auto',
      hotPE: animating && !(a && a.drag) ? 'none' : 'auto',
      canNext: !atEnd, canPrev: !atStart,
      prevOff: atStart || animating, nextOff: atEnd || animating,
      stageRef: this.stageRef, sheetRef: this.sheetRef, castARef: this.castARef, castBRef: this.castBRef, shadeFRef: this.shadeFRef, shadeBRef: this.shadeBRef,
      downNext: this.downNext, downPrev: this.downPrev, dragMove: this.dragMove, dragUp: this.dragUp,
      hearts: hearts,
      heartsLabel: 'Progresso de leitura: ' + filled + ' de 5 corações',
      toggleReading: function () { if (!self.busy) self.setState({ reading: !st.reading }); },
      liveMsg: liveMsg,
      pager: st.narrow ? 'PÁG ' + pad(p + 1) + ' / ' + total : 'PÁG ' + pad(2 * k + 1) + '–' + pad(2 * k + 2) + ' / ' + total,
      prev: function () { self.flipTo(self.targetFor('prev')); },
      next: function () { self.flipTo(self.targetFor('next')); },
      goToc: function () { self.goTocFn(); }
    };
  }
}
